[package]
name = "peek-trait"
version = "0.1.1"
rust-version = "1.85.1"
description = "Zero-cost iterator peeking"
repository = "https://github.com/mysteriouslyseeing/peek-trait"
license = "MIT"
keywords = ["iterator", "peek", "peekable", "lookahead", "double-ended"]
categories = ["rust-patterns", "algorithms"]
edition = "2024"

[dependencies]
delegate = "0.13.5"

[dev-dependencies]
generic-tests = "0.1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }